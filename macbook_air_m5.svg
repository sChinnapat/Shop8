<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dbe2eb"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6e9ed"/>
      <stop offset="55%" stop-color="#c9ced6"/>
      <stop offset="100%" stop-color="#b3b9c2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3442"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7dbe2"/>
      <stop offset="100%" stop-color="#aab0ba"/>
    </linearGradient>
    <linearGradient id="baseEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa0aa"/>
      <stop offset="100%" stop-color="#7c828d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="252" rx="150" ry="14" fill="#000000" opacity="0.10"/>

  <!-- screen lid -->
  <path d="M118 62 L282 62 Q292 62 292 72 L292 214 L108 214 L108 72 Q108 62 118 62 Z" fill="url(#lid)"/>
  <path d="M126 74 L274 74 Q280 74 280 80 L280 202 L120 202 L120 80 Q120 74 126 74 Z" fill="url(#screen)"/>
  <rect x="120" y="80" width="160" height="122" fill="url(#glow)"/>
  <circle cx="200" cy="68" r="2" fill="#4a5568"/>

  <!-- subtle on-screen UI hint -->
  <rect x="134" y="94" width="132" height="8" rx="4" fill="#3d4a5c"/>
  <rect x="134" y="110" width="90" height="6" rx="3" fill="#2f3a49"/>
  <rect x="134" y="132" width="58" height="46" rx="4" fill="#233043"/>
  <rect x="198" y="132" width="58" height="46" rx="4" fill="#233043"/>

  <!-- keyboard base (wedge profile, thin at front) -->
  <path d="M92 214 L308 214 L332 240 Q334 244 330 246 L70 246 Q66 244 68 240 Z" fill="url(#base)"/>
  <path d="M68 240 L330 240 L340 250 Q342 254 337 256 L63 256 Q58 254 60 250 Z" fill="url(#baseEdge)"/>
  <rect x="176" y="242" width="48" height="4" rx="2" fill="#8a909b"/>

  <text x="200" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="0.5">MacBook Air</text>
  <text x="200" y="293" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="0.5">M5 · 13"</text>
</svg>
